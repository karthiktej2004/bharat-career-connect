name: Deploy Frontend to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Normalize SSH inputs
        id: ssh_inputs
        shell: bash
        run: |
          host="${{ secrets.EC2_HOST }}"
          host="${host#tcp://}"
          host="${host#ssh://}"
          host="${host#http://}"
          host="${host#https://}"
          host="${host%%/*}"

          if [[ "$host" == *:* ]]; then
            echo "host=${host%:*}" >> "$GITHUB_OUTPUT"
            echo "port=${host##*:}" >> "$GITHUB_OUTPUT"
          else
            echo "host=$host" >> "$GITHUB_OUTPUT"
            echo "port=22" >> "$GITHUB_OUTPUT"
          fi

          key_file="$RUNNER_TEMP/ec2_ssh_key"
          printf '%s' "${{ secrets.EC2_SSH_KEY }}" | sed 's/\\n/\n/g' | tr -d '\r' > "$key_file"
          chmod 600 "$key_file"
          echo "key_path=$key_file" >> "$GITHUB_OUTPUT"

      - name: Execute remote ssh commands using ssh key
        uses: appleboy/ssh-action@master
        with:
          host: ${{ steps.ssh_inputs.outputs.host }}
          port: ${{ steps.ssh_inputs.outputs.port }}
          username: ubuntu
          key_path: ${{ steps.ssh_inputs.outputs.key_path }}
          script: |
            cd ~/bharat-career-connect
            git pull origin main
            npm install
            npm run build
            pm2 restart bcc-frontend
